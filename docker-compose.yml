version: '3.8'

services:
  amnezia_panel:
    image: prvtpro/amnezia-panel:latest
    container_name: amnezia_panel

    ports:
      - "${APP_PORT:-5000}:5000"

    volumes:
      - amnezia_data:/app/data

    secrets:
      - ssh_credentials_key

    environment:
      DATA_FILE: /app/data/data.json
      SSH_CREDENTIALS_KEY_FILE: /run/secrets/ssh-credentials-key
      PANEL_ADMIN_MFA_REQUIRED: ${PANEL_ADMIN_MFA_REQUIRED:-1}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.connect(('localhost', 5000)); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  amnezia_data:

secrets:
  ssh_credentials_key:
    file: ./secrets/ssh-credentials.key
